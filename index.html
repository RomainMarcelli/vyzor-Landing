  <style>
    :root {
      /* Système typographique unifié — 2 polices max */
      --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      /* Alias sémantiques (titres / corps partagent Inter, graisses différentes) */
      --font-display: var(--font-sans);
      --font-text: var(--font-sans);
    }
    html, body, #root { margin: 0; padding: 0; }
    html, body { background: #070a14; }

    /* —— Scroll fluide + offset pour la nav flottante —— */
    html {
      scroll-behavior: smooth;
      scroll-padding-top: 110px;
    }

    /* —— Reveal subtil à l'entrée en viewport —— */
    .vz-reveal {
      opacity: 0;
      transform: translateY(28px);
      transition:
        opacity 800ms cubic-bezier(0.22, 1, 0.36, 1),
        transform 800ms cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, transform;
    }
    .vz-reveal.in {
      opacity: 1;
      transform: none;
    }
    /* Effet en cascade léger entre sections successives */
    .vz-reveal.in + .vz-reveal.in { transition-delay: 60ms; }

    /* —— Respect de l'accessibilité —— */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .vz-reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
      * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
    }

    body {
      font-family: var(--font-sans);
      font-feature-settings: "ss01", "cv11", "calt";
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      color: rgba(255,255,255,0.92);
      overflow-x: hidden;
    }
    /* Tout hérite du body — pas de re-déclaration sauvage */
    button, input, textarea, select { font-family: inherit; }
    h1, h2, h3, h4, h5, h6 { font-family: var(--font-display); letter-spacing: -0.02em; }
    code, kbd, samp, pre { font-family: var(--font-mono); }
    * { box-sizing: border-box; }
    a { color: inherit; }
    ::selection { background: rgba(240,201,73,0.35); color: #fff; }
  </style>

<body>
  <div id="root"></div>
  <noscript>
    <div style="max-width:760px;margin:0 auto;padding:64px 24px;font-family:system-ui,-apple-system,sans-serif;color:#e7e9f0;line-height:1.6;">
      <h1 style="font-size:32px;margin:0 0 16px;">VYZOR — Pilotage financier intelligent</h1>
      <p style="font-size:17px;color:#aab;margin:0 0 24px;">Le copilote financier intelligent pour dirigeants, DAF et comptables. Reporting, prévisions et calculateurs financiers gratuits.</p>
      <nav style="font-size:15px;font-weight:600;"><a href="fonctionnalites.html" style="color:#f0c949;margin-right:18px;">Fonctionnalités</a><a href="securite.html" style="color:#f0c949;margin-right:18px;">Sécurité</a><a href="calculateurs.html" style="color:#f0c949;margin-right:18px;">Calculateurs gratuits</a></nav>
    </div>
  </noscript>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="glow-border.jsx"></script>
  <script type="text/babel" src="cinematic-hero-glass.jsx"></script>
  <script type="text/babel" src="variant-a.jsx"></script>
  <script type="text/babel" src="features-glass.jsx"></script>
  <script type="text/babel" src="daf-coconception.jsx"></script>
  <script type="text/babel" src="security-glass.jsx"></script>
  <script type="text/babel" src="beta-glass.jsx"></script>
  <script type="text/babel" src="footer-glass.jsx"></script>

  <script type="text/babel">
    // —— Petit "duo de cartes" compact pour inciter à visiter Fonctionnalités & Sécurité
    const ExploreMore = ({ gold, text, muted, subtle }) => {
      const items = [
        {
          href: "fonctionnalites.html",
          kicker: "Fonctionnalités",
          title: "Voir tout ce que Vyzor sait faire",
          icon: (
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7" rx="1.2"/>
              <rect x="14" y="3" width="7" height="7" rx="1.2"/>
              <rect x="3" y="14" width="7" height="7" rx="1.2"/>
              <rect x="14" y="14" width="7" height="7" rx="1.2"/>
            </svg>
          ),
        },
        {
          href: "securite.html",
          kicker: "Sécurité",
          title: "Hébergement français, chiffrement, conformité",
          icon: (
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
              <path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z"/>
              <path d="m9 12 2 2 4-4"/>
            </svg>
          ),
        },
      ];
      return (
        <div className="vz-explore-more" style={{
          display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12,
          marginTop: -56, marginBottom: 80,
        }}>
          {items.map((it) => (
            <a key={it.href} href={it.href} style={{
              display: "flex", alignItems: "center", gap: 16,
              padding: "16px 20px", borderRadius: 14,
              background: "rgba(255,255,255,0.02)",
              border: `1px solid ${subtle}`,
              textDecoration: "none", color: text,
              transition: "background 220ms ease, border-color 220ms ease, transform 220ms ease",
            }}
              onMouseOver={(e) => {
                e.currentTarget.style.background = "rgba(240,201,73,0.04)";
                e.currentTarget.style.borderColor = "rgba(240,201,73,0.28)";
                e.currentTarget.style.transform = "translateY(-1px)";
                const arrow = e.currentTarget.querySelector(".vz-explore-arrow");
                if (arrow) arrow.style.transform = "translateX(4px)";
              }}
              onMouseOut={(e) => {
                e.currentTarget.style.background = "rgba(255,255,255,0.02)";
                e.currentTarget.style.borderColor = subtle;
                e.currentTarget.style.transform = "translateY(0)";
                const arrow = e.currentTarget.querySelector(".vz-explore-arrow");
                if (arrow) arrow.style.transform = "translateX(0)";
              }}
            >
              <span style={{
                width: 36, height: 36, borderRadius: 10, flexShrink: 0,
                display: "grid", placeItems: "center",
                background: "rgba(240,201,73,0.08)",
                border: "1px solid rgba(240,201,73,0.22)",
                color: gold,
              }}>{it.icon}</span>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{
                  fontSize: 10, letterSpacing: "0.22em", textTransform: "uppercase",
                  fontWeight: 700, color: gold, marginBottom: 3,
                }}>{it.kicker}</div>
                <div style={{
                  fontSize: 14, fontWeight: 500, letterSpacing: "-0.005em",
                  whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
                }}>{it.title}</div>
              </div>
              <span className="vz-explore-arrow" style={{
                color: gold, fontSize: 16, flexShrink: 0,
                transition: "transform 220ms ease",
              }}>→</span>
            </a>
          ))}
        </div>
      );
    };

    const App = () => {
      const gold = "#f0c949";
      const text = "rgba(255,255,255,0.92)";
      const muted = "rgba(255,255,255,0.55)";
      const subtle = "rgba(255,255,255,0.08)";

      // Reveal-on-scroll : on observe les éléments .vz-reveal et on ajoute .in
      React.useEffect(() => {
        if (typeof IntersectionObserver === "undefined") {
          document.querySelectorAll(".vz-reveal").forEach(el => el.classList.add("in"));
          return;
        }
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) {
              e.target.classList.add("in");
              io.unobserve(e.target);
            }
          });
        }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });

        // On laisse React monter le DOM avant d'observer
        const id = requestAnimationFrame(() => {
          document.querySelectorAll(".vz-reveal").forEach(el => io.observe(el));
        });
        return () => { cancelAnimationFrame(id); io.disconnect(); };
      }, []);

      return (
        <React.Fragment>
          <VyzorNav gold={gold} text={text} muted={muted} subtle={subtle} />
          <CinematicHero />
          {/* Reste de la page : on réutilise les sections de la variante A après le hero cinématique */}
          <div style={{ position: "relative", zIndex: 1 }}>
            <RestOfPage />
          </div>
        </React.Fragment>
      );
    };

    // Wrapper that reuses VariantA sections AFTER the hero — we render VariantA but
    // hide its built-in hero by adjusting layout (cinematic hero replaces it).
    const RestOfPage = () => {
      const gold = "#f0c949";
      const text = "rgba(255,255,255,0.92)";
      const muted = "rgba(255,255,255,0.55)";
      const subtle = "rgba(255,255,255,0.08)";
      return (
        <div style={{
          background: "#070a14",
          backgroundImage:
            "radial-gradient(60% 40% at 15% 0%, rgba(99,102,241,0.18), transparent 60%), radial-gradient(50% 40% at 90% 10%, rgba(240,201,73,0.14), transparent 60%), radial-gradient(40% 30% at 50% 100%, rgba(45,212,191,0.10), transparent 60%)",
          color: text,
          fontFamily: '"Inter", system-ui, sans-serif',
          padding: "32px 0 56px",
          position: "relative",
          overflow: "hidden",
        }}>
          <div className="vz-page-pad" style={{
            maxWidth: 1180,
            margin: "0 auto",
            padding: "0 clamp(24px, 6vw, 96px)",
          }}>
            <div className="vz-reveal"><MethodologySection id="produit" gold={gold} text={text} muted={muted} subtle={subtle} /></div>
            <div className="vz-reveal"><DAFCoConception /></div>
            <div className="vz-reveal"><ExploreMore gold={gold} text={text} muted={muted} subtle={subtle} /></div>
            <div className="vz-reveal"><BetaFormGlass /></div>
          </div>
          {/* Footer plein écran — sort du container 1180px */}
          <div className="vz-reveal" style={{ marginTop: 96 }}>
            <VyzorFooterGlass fullWidth />
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
