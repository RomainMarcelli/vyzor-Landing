<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>VYZOR — Pilotage intelligent pour décideurs exigeants</title>
  <meta name="description" content="VYZOR — Le copilote financier intelligent pour dirigeants. Reporting, prévisions, calculateurs gratuits." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="responsive.css" />
  <style>
    :root {
      /* Système typographique unifié — 2 polices max */
      --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      /* Alias sémantiques (titres / corps partagent Inter, graisses différentes) */
      --font-display: var(--font-sans);
      --font-text: var(--font-sans);
    }
    html, body, #root { margin: 0; padding: 0; }
    html, body { background: #070a14; }

    /* —— Scroll fluide + offset pour la nav flottante —— */
    html {
      scroll-behavior: smooth;
      scroll-padding-top: 110px;
    }

    /* —— Reveal subtil à l'entrée en viewport —— */
    .vz-reveal {
      opacity: 0;
      transform: translateY(28px);
      transition:
        opacity 800ms cubic-bezier(0.22, 1, 0.36, 1),
        transform 800ms cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, transform;
    }
    .vz-reveal.in {
      opacity: 1;
      transform: none;
    }
    /* Effet en cascade léger entre sections successives */
    .vz-reveal.in + .vz-reveal.in { transition-delay: 60ms; }

    /* —— Respect de l'accessibilité —— */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .vz-reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
      * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
    }

    body {
      font-family: var(--font-sans);
      font-feature-settings: "ss01", "cv11", "calt";
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      color: rgba(255,255,255,0.92);
      overflow-x: hidden;
    }
    /* Tout hérite du body — pas de re-déclaration sauvage */
    button, input, textarea, select { font-family: inherit; }
    h1, h2, h3, h4, h5, h6 { font-family: var(--font-display); letter-spacing: -0.02em; }
    code, kbd, samp, pre { font-family: var(--font-mono); }
    * { box-sizing: border-box; }
    a { color: inherit; }
    ::selection { background: rgba(240,201,73,0.35); color: #fff; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="glow-border.jsx"></script>
  <script type="text/babel" src="cinematic-hero-glass.jsx"></script>
  <script type="text/babel" src="variant-a.jsx"></script>
  <script type="text/babel" src="features-glass.jsx"></script>
  <script type="text/babel" src="beta-glass.jsx"></script>
  <script type="text/babel" src="footer-glass.jsx"></script>

  <script type="text/babel">
    const App = () => {
      const gold = "#f0c949";
      const text = "rgba(255,255,255,0.92)";
      const muted = "rgba(255,255,255,0.55)";
      const subtle = "rgba(255,255,255,0.08)";

      // Reveal-on-scroll : on observe les éléments .vz-reveal et on ajoute .in
      React.useEffect(() => {
        if (typeof IntersectionObserver === "undefined") {
          document.querySelectorAll(".vz-reveal").forEach(el => el.classList.add("in"));
          return;
        }
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) {
              e.target.classList.add("in");
              io.unobserve(e.target);
            }
          });
        }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });

        // On laisse React monter le DOM avant d'observer
        const id = requestAnimationFrame(() => {
          document.querySelectorAll(".vz-reveal").forEach(el => io.observe(el));
        });
        return () => { cancelAnimationFrame(id); io.disconnect(); };
      }, []);

      return (
        <React.Fragment>
          <VyzorNav gold={gold} text={text} muted={muted} subtle={subtle} />
          <CinematicHero />
          {/* Reste de la page : on réutilise les sections de la variante A après le hero cinématique */}
          <div style={{ position: "relative", zIndex: 1 }}>
            <RestOfPage />
          </div>
        </React.Fragment>
      );
    };

    // Wrapper that reuses VariantA sections AFTER the hero — we render VariantA but
    // hide its built-in hero by adjusting layout (cinematic hero replaces it).
    const RestOfPage = () => {
      const gold = "#f0c949";
      const text = "rgba(255,255,255,0.92)";
      const muted = "rgba(255,255,255,0.55)";
      const subtle = "rgba(255,255,255,0.08)";
      return (
        <div style={{
          background: "#070a14",
          backgroundImage:
            "radial-gradient(60% 40% at 15% 0%, rgba(99,102,241,0.18), transparent 60%), radial-gradient(50% 40% at 90% 10%, rgba(240,201,73,0.14), transparent 60%), radial-gradient(40% 30% at 50% 100%, rgba(45,212,191,0.10), transparent 60%)",
          color: text,
          fontFamily: '"Inter", system-ui, sans-serif',
          padding: "32px 0 56px",
          position: "relative",
          overflow: "hidden",
        }}>
          <div className="vz-page-pad" style={{
            maxWidth: 1180,
            margin: "0 auto",
            padding: "0 clamp(24px, 6vw, 96px)",
          }}>
            <div className="vz-reveal"><MethodologySection id="produit" gold={gold} text={text} muted={muted} subtle={subtle} /></div>
            <div className="vz-reveal"><FeaturesGlass /></div>
            <div className="vz-reveal"><BetaFormGlass /></div>
          </div>
          {/* Footer plein écran — sort du container 1180px */}
          <div className="vz-reveal" style={{ marginTop: 96 }}>
            <VyzorFooterGlass fullWidth />
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
