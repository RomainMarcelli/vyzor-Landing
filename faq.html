érarchisées par impact en euros et un export PDF prêt pour le conseil d'administration."}},{"@type":"Question","name":"Comment accéder à VYZOR ?","acceptedAnswer":{"@type":"Answer","text":"VYZOR est actuellement en accès anticipé (bêta), façonné avec ses premiers utilisateurs. Vous pouvez demander votre accès directement depuis le formulaire en bas de page."}}]}</script>

    const App = () => {

      React.useEffect(() => {
        if (typeof IntersectionObserver === "undefined") {
          document.querySelectorAll(".vz-reveal").forEach(el => el.classList.add("in"));
          return;
        }
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
          });
        }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
        const id = requestAnimationFrame(() => {
          document.querySelectorAll(".vz-reveal").forEach(el => io.observe(el));
        });
        return () => { cancelAnimationFrame(id); io.disconnect(); };
      }, []);

      return (
        <React.Fragment>

            background: "#070a14",

              <VyzorFooterGlass fullWidth />

          </div>
        </React.Fragment>
      );
    };
